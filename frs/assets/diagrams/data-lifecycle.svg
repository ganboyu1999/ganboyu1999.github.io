<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="766" viewBox="0 0 1200 766" role="img" aria-labelledby="title desc">
  <title id="title">Topic 数据的生命周期</title>
  <desc id="desc">活动 Atom 的读取声明使 FRS 创建或复用共享缓存。消息经 FRS 接收后写入有界 CDR 缓存；Atom 读取稳定快照，使用公共 IDL 解码，业务检查年龄、质量与维度。新帧在缓存满时覆盖旧槽，读取不消耗帧。Atom 读取引用归零时释放共享段及该 Topic 的命名队列；Reader 仍按 Core、SDK 与 Atom 的引用关系保留或释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333333"/></marker>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; } path { stroke-linejoin: round; }</style>
  </defs>
  <rect width="1200" height="766" fill="#ffffff"/>
  <text x="32" y="48" font-size="25" font-weight="500" text-anchor="start" fill="#222222">Topic 数据的生命周期</text>
  <rect x="244" y="166" width="476" height="570" fill="#ffffff" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="260" y="195" font-size="20" font-weight="400" text-anchor="start" fill="#222222">FRS</text>
  <rect x="724" y="166" width="468" height="426" fill="#ffffff" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="740" y="195" font-size="20" font-weight="400" text-anchor="start" fill="#222222">Atom 进程</text>
  <rect x="504" y="84" width="192" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="600.0" y="110.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">Atom 启动</text>
  <text x="600.0" y="137.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">topics.read</text>
  <rect x="504" y="234" width="192" height="48" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="600.0" y="265.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">创建 / 复用</text>
  <rect x="32" y="314" width="184" height="80" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="124.0" y="348.0" font-size="19" font-weight="400" text-anchor="middle" fill="#222222">机器人 / FHM</text>
  <text x="124.0" y="375.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">IDL 消息</text>
  <rect x="268" y="314" width="184" height="80" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="360.0" y="348.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">FRS 接收</text>
  <text x="360.0" y="375.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">DDS Reader</text>
  <rect x="504" y="304" width="192" height="100" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="600" y="335" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">共享缓存</text>
  <text x="600" y="363" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">CDR + meta</text>
  <text x="600" y="386" font-size="16" font-weight="400" text-anchor="middle" fill="#222222">至少 10 帧 · 8 MiB 基准</text>
  <rect x="748" y="214" width="184" height="70" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="840.0" y="243.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">读取方式</text>
  <text x="840.0" y="270.0" font-size="13" font-weight="400" text-anchor="middle" fill="#222222">最新 / 游标 / 源序号 / 源时间</text>
  <rect x="748" y="314" width="184" height="80" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="840.0" y="348.0" font-size="19" font-weight="400" text-anchor="middle" fill="#222222">DataLoader.get</text>
  <text x="840.0" y="375.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">稳定快照</text>
  <rect x="1000" y="314" width="168" height="80" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="1084.0" y="348.0" font-size="19" font-weight="400" text-anchor="middle" fill="#222222">公共 IDL 解码</text>
  <text x="1084.0" y="375.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">msg + frs</text>
  <rect x="748" y="502" width="184" height="56" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="840.0" y="537.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">读取错误</text>
  <rect x="1000" y="502" width="168" height="56" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="1084.0" y="524.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">业务使用</text>
  <text x="1084.0" y="551.0" font-size="14" font-weight="400" text-anchor="middle" fill="#222222">age / quality / 维度</text>
  <rect x="268" y="492" width="184" height="72" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="360.0" y="535.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">覆盖最旧槽</text>
  <rect x="504" y="644" width="192" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="600.0" y="670.0" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">缓存释放</text>
  <text x="600.0" y="697.0" font-size="16" font-weight="400" text-anchor="middle" fill="#222222">共享段 / 关联队列</text>
  <rect x="268" y="644" width="184" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="360.0" y="670.0" font-size="18" font-weight="400" text-anchor="middle" fill="#222222">Reader 引用检查</text>
  <text x="360.0" y="697.0" font-size="16" font-weight="400" text-anchor="middle" fill="#222222">归零时释放</text>
  <path d="M600 148 L600 234" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="620" y="217" font-size="16" font-weight="400" text-anchor="start" fill="#222222">读取声明</text>
  <path d="M600 282 L600 304" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M216 354 L268 354" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M452 354 L504 354" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M696 354 L748 354" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M932 354 L1000 354" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M840 284 L840 314" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M840 394 L840 502" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="860" y="464" font-size="16" font-weight="400" text-anchor="start" fill="#222222">未命中</text>
  <path d="M1084 394 L1084 502" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M544 404 L544 528 L452 528" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="524" y="480" font-size="16" font-weight="400" text-anchor="end" fill="#222222">新帧 / 缓存满</text>
  <path d="M360 492 L360 446 L520 446 L520 404" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M600 404 L600 644" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="580" y="603" font-size="16" font-weight="400" text-anchor="end" fill="#222222">Atom 读取引用归零</text>
  <path d="M504 676 L452 676" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
