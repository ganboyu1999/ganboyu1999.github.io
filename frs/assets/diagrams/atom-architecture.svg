<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Atom：模块运行与插件</title><desc id="desc">FRS 管理 Atom 子进程。进程管道传递命令与报告，共享缓存提供只读数据；算法插件由模块自身集成，Atom 通过 FRS SDK 访问服务。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}</style><defs>
<marker id="line" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B8198"/></marker>
<marker id="line-start" markerWidth="10" markerHeight="10" refX="1" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#6B8198"/></marker>
<marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2867B2"/></marker>
<marker id="blue-start" markerWidth="10" markerHeight="10" refX="1" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#2867B2"/></marker>
<marker id="data" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#078B87"/></marker>
<marker id="data-start" markerWidth="10" markerHeight="10" refX="1" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#078B87"/></marker>
<marker id="control" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#CF6B32"/></marker>
<marker id="control-start" markerWidth="10" markerHeight="10" refX="1" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#CF6B32"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="860" rx="0" fill="white" stroke="none" stroke-width="2"/>
