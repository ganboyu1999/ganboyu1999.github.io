<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2630" viewBox="0 0 3200 2630" role="img" aria-labelledby="title desc">
<title id="title">FDI 软件架构</title>
<desc id="desc">FDI 软件架构。FDT 通过 fdi_control_client 的 JSONL 接口和私有 DDS 调用 fdi_onboard，原生 fdi CLI 使用同一 DDS 控制面。fdi_onboard 内部包含数据监听、ControlApi、Recorder、FilterChain、进程内前滚缓存、事件窗口、MCAP Writer、IDL Catalog、后台上传与清理管理。事件和连续录制落地本地文件后由 IngestAgent 上传 S3 或 MinIO。独立的 fdi_echo_stream 进程直接订阅机器人 Topic，并向 FVIZ 输出 JSONL 实时流；不经过 Recorder。虚线框表示独立进程。</desc>
