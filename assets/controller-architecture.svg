<path d="M 520,300 L 740,300 L 740,852 L 840,852" fill="none" stroke="#6B8198" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#line)" marker-start="url(#line-start)" stroke-dasharray="7 5"/>
<text x="775" y="780" text-anchor="middle" font-size="21" fill="#6B8198" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round">SDK / 协调控制</text>
