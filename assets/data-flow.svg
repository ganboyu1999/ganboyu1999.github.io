<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc">
  <title id="title">Topic 读取与发布</title>
  <desc id="desc">共用 DDS Reader 接收完整 Topic 消息，Python 和 C++ 应用通过 Socket 读取，托管 Atom 从共享缓存读取并解码。发布消息和调用服务经宿主 RPC、TopicPublishManager 的类型与权限校验，再通过 PlatformAdapter 的 DDS Writer 或 Client 到达机器人或 FHM。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333333"/></marker>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; } path { stroke-linejoin: round; }</style>
  </defs>
  <rect width="1200" height="764" fill="#ffffff"/>
