  <text x="1010.0" y="404.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">Atom</text>
  <text x="1010.0" y="431.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">DataLoader / 公共 IDL</text>
