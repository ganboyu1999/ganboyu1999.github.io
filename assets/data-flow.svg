  <text x="600.0" y="240.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">Topic 运行时</text>
  <text x="600.0" y="267.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">DDS Reader</text>
  <rect x="860" y="214" width="300" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="1010.0" y="240.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">应用</text>
  <text x="1010.0" y="267.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">Python / C++ SDK</text>
  <rect x="450" y="378" width="300" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
