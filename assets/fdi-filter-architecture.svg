<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1550" viewBox="0 0 2100 1550" role="img" aria-labelledby="title desc">
<title id="title">FDI 筛选器架构</title>
<desc id="desc">基于 FDI 当前源码的筛选器架构。内置 C++ 筛选器通过 REGISTER_FILTER 注册到 FilterRegistry，由 YAML 启用后装配为 FilterChain。消息进入 evaluate 时按需共享解码，逐一调用所有筛选器。录制型筛选器按 OR 合并决策，监测型筛选器不参与录制门控，而是向 EventQueue 发送异步事件。主循环约每 200 毫秒调用 onTick 并由 Recorder 消费事件。事件数据经独立采样策略进入前滚缓存及活动窗口，事件触发后形成事件包。系统日志、CPU 和转储监测在同一 fdi_onboard 进程内通过定时检查或后台线程接入。录制决策器的存在决定是否自动开启连续录制。</desc>
