<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2680" viewBox="0 0 3200 2680" role="img" aria-labelledby="title desc">
<title id="title">FVIZ 软件架构</title><desc id="desc">FVIZ 工作台分为面板、共享工作区状态与数据接入。离线文件在前端解析并按时间线回放；实时数据通过 FDI Web 数据接口进入工作台。Python 本地服务管理桌面集成、连接与控制桥接。机器人侧实时采集和控制服务位于外部运行边界。架构依据 FVIZ 1.3.1 安装包实现及配套开发文档整理。</desc>
