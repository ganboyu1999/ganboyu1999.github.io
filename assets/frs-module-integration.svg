  <text x="640.0" y="351.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">服务调用入口（RPC）</text>
  <rect x="372" y="436" width="248" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="496.0" y="475.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">AtomHelper</text>
  <rect x="656" y="434" width="252" height="312" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="782" y="470" font-size="20" font-weight="400" text-anchor="middle" fill="#222222">ControllerManager</text>
  <rect x="680" y="562" width="204" height="60" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
