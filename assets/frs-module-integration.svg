  <text x="496.0" y="703.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">DDS Reader</text>
  <rect x="372" y="804" width="536" height="64" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
