<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2180" viewBox="0 0 3200 2180" role="img" aria-labelledby="title desc">
<title id="title">FRS 软件架构</title>
<desc id="desc">FRS 软件架构。二次开发 SDK 经 Unix Socket 接入服务进程。AtomHelper 管理 Atom 子进程；Atom Runtime 运行原子能力并集成算法插件。FRS RT 的数据运行时包含 Topic 读写与 CDR 共享内存缓存，DataLoader 在 Atom 子进程只读映射缓存。ControllerManager 通过专用 IPC 管理 Controller Worker，由 Worker 加载控制器动态库。FRS 提供系统 SDK 适配、控制权管理、帧校验与平台适配；系统接口仅作为外部连接端点。虚线框表示进程边界。</desc>
