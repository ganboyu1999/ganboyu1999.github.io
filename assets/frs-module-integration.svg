<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1052" viewBox="0 0 1280 1052" role="img" aria-labelledby="title desc">
  <title id="title">FRS 整体架构</title>
  <desc id="desc">应用经 Unix Socket 调用 FRS。AtomHelper 管理独立 Atom 子进程并激活读取 Topic，FRS 写入共享缓存，Atom 的 DataLoader 只读解码。ControllerManager 托管加载 C++ 共享库的 worker，publish 回调进入宿主的帧校验和控制权管理，再由 PlatformAdapter 发布。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333333"/></marker>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; } path { stroke-linejoin: round; }</style>
  </defs>
  <rect width="1280" height="1052" fill="#ffffff"/>
  <text x="32" y="48" font-size="25" font-weight="500" text-anchor="start" fill="#222222">FRS 整体架构</text>
  <rect x="440" y="82" width="400" height="82" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <text x="640.0" y="117.0" font-size="21" font-weight="400" text-anchor="middle" fill="#222222">应用</text>
  <text x="640.0" y="144.0" font-size="17" font-weight="400" text-anchor="middle" fill="#222222">Python / C++ SDK / CLI</text>
  <rect x="344" y="234" width="592" height="644" fill="#ffffff" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 4"/>
